<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{COMPANY}} — Brief for {{ROLE}}</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  body {
    font-family: Arial, Helvetica, 'Noto Sans', 'Liberation Sans', sans-serif;
    font-size: 11.5px;
    line-height: 1.65;
    color: #1a1a2e;
    background: #ffffff;
  }

  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 8px 16px;
  }

  /* === HEADER === */
  .header { margin-bottom: 22px; }

  .header h1 {
    font-family: Arial, Helvetica, 'Noto Sans', 'Liberation Sans', sans-serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #1a1a2e;
    margin-bottom: 4px;
  }

  .header .role {
    font-family: Arial, Helvetica, 'Noto Sans', 'Liberation Sans', sans-serif;
    font-size: 12.5px;
    color: #555;
    margin-bottom: 8px;
  }

  .header-gradient {
    height: 2px;
    background: linear-gradient(to right, hsl(187, 74%, 32%), hsl(270, 70%, 45%));
    border-radius: 1px;
    margin-top: 4px;
    width: 56px;
  }

  /* === ONE-LINER === */
  .oneliner {
    border-left: 3px solid hsl(270, 70%, 45%);
    padding: 6px 12px;
    margin: 0 0 22px;
    font-size: 12px;
    color: #333;
    background: #faf8ff;
    font-style: italic;
  }

  /* === SECTIONS === */
  .section {
    margin-bottom: 18px;
    break-inside: avoid;
  }

  .section-title {
    font-family: Arial, Helvetica, 'Noto Sans', 'Liberation Sans', sans-serif;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: hsl(270, 70%, 45%);
    margin-bottom: 6px;
    border-bottom: 1px solid #e8e4f0;
    padding-bottom: 3px;
  }

  .section p {
    font-size: 11.5px;
    color: #2a2a2a;
    line-height: 1.65;
  }

  .section ul {
    margin: 4px 0 0 18px;
  }

  .section li {
    font-size: 11.5px;
    color: #2a2a2a;
    margin-bottom: 3px;
    line-height: 1.55;
  }

  .verify li {
    list-style: none;
    padding-left: 16px;
    position: relative;
  }

  .verify li::before {
    content: "☐";
    position: absolute;
    left: 0;
    color: hsl(187, 74%, 32%);
    font-weight: 700;
  }

  @media print {
    .page { padding-top: 0; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <h1>{{COMPANY}}</h1>
    <div class="role">Brief for: {{ROLE}}</div>
    <div class="header-gradient"></div>
  </div>

  {{ONELINER_BLOCK}}

  {{WHAT_BLOCK}}

  {{PRODUCTS_BLOCK}}

  {{INDUSTRY_BLOCK}}

  {{CULTURE_BLOCK}}

  {{POSITION_BLOCK}}

  {{VERIFY_BLOCK}}

</div>
</body>
</html>
