<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{COMPANY}} — Brief for {{ROLE}}</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  body {
    font-family: Arial, Helvetica, 'Liberation Sans', 'Noto Sans', sans-serif;
    font-size: 10.5px;
    line-height: 1.5;
    color: #000;
    background: #fff;
  }

  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 2px 2px 0;
  }

  /* === HEADER (left-aligned, matches résumé) === */
  .header { margin-bottom: 11px; }

  .header h1 {
    font-size: 23px;
    font-weight: 700;
    letter-spacing: 0.2px;
    margin-bottom: 3px;
  }
  .header .role { font-size: 10.5px; color: #555; }

  /* === ONE-LINER (plain, gray left rule) === */
  .oneliner {
    border-left: 2px solid #999;
    padding: 2px 10px;
    margin: 4px 0 11px;
    font-size: 10.5px;
    color: #333;
    font-style: italic;
  }

  /* === SECTIONS: bold uppercase + bottom rule === */
  .section { margin-bottom: 9px; break-inside: avoid; }

  .section-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #000;
    border-bottom: 1px solid #000;
    padding-bottom: 2px;
    margin-bottom: 6px;
  }

  .section p { font-size: 10.5px; color: #000; line-height: 1.5; }
  .section ul { margin: 3px 0 0 17px; }
  .section li { font-size: 10.5px; color: #000; margin-bottom: 2px; line-height: 1.45; }

  .verify li {
    list-style: none;
    padding-left: 16px;
    position: relative;
  }
  .verify li::before {
    content: "\2610";
    position: absolute;
    left: 0;
    color: #000;
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <h1>{{COMPANY}}</h1>
    <div class="role">Brief for: {{ROLE}}</div>
  </div>

  {{ONELINER_BLOCK}}

  {{WHAT_BLOCK}}

  {{PRODUCTS_BLOCK}}

  {{INDUSTRY_BLOCK}}

  {{CULTURE_BLOCK}}

  {{POSITION_BLOCK}}

  {{VERIFY_BLOCK}}

</div>
</body>
</html>
