<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{NAME}} — Cover Letter — {{COMPANY}}</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  body {
    font-family: Arial, Helvetica, 'Liberation Sans', 'Noto Sans', sans-serif;
    font-size: 10.5px;
    line-height: 1.5;
    color: #000;
    background: #fff;
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 2px 2px 0;
  }

  /* === LETTERHEAD (left-aligned, matches résumé) === */
  .letterhead { margin-bottom: 18px; }

  .letterhead h1 {
    font-size: 23px;
    font-weight: 700;
    letter-spacing: 0.2px;
    margin-bottom: 3px;
  }

  .letterhead-contact { font-size: 10.5px; color: #333; line-height: 1.45; }
  .letterhead-contact a { color: #333; text-decoration: none; }

  /* === META === */
  .meta { margin-bottom: 14px; }
  .meta-date { font-size: 10.5px; color: #555; margin-bottom: 12px; }
  .recipient { font-size: 10.5px; line-height: 1.45; color: #000; }
  .recipient strong { font-weight: 700; }

  /* === BODY === */
  .salutation { margin-bottom: 10px; font-size: 10.5px; }
  .body { font-size: 10.5px; line-height: 1.55; }
  .body p { margin-bottom: 10px; }

  /* === SIGN OFF === */
  .signoff { margin-top: 14px; font-size: 10.5px; }
  .signoff-name { margin-top: 3px; font-weight: 700; }
</style>
</head>
<body>
<div class="page">

  <div class="letterhead">
    <h1>{{NAME}}</h1>
    <div class="letterhead-contact">{{CONTACT_LINE}}</div>
  </div>

  <div class="meta">
    <div class="meta-date">{{DATE}}</div>
    <div class="recipient">{{RECIPIENT_BLOCK}}</div>
  </div>

  <div class="salutation">{{SALUTATION}}</div>

  <div class="body">{{BODY_PARAGRAPHS}}</div>

  <div class="signoff">
    {{CLOSING}}
    <div class="signoff-name">{{NAME}}</div>
  </div>

</div>
</body>
</html>
