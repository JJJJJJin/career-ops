<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{NAME}} — Resume</title>
<style>
  @font-face {
    font-family: 'DM Sans';
    src: url('../fonts/dm-sans-latin.woff2') format('woff2');
    font-weight: 100 1000;
    font-style: normal;
    font-display: block;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'DM Sans';
    src: url('../fonts/dm-sans-latin-ext.woff2') format('woff2');
    font-weight: 100 1000;
    font-style: normal;
    font-display: block;
    unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  body {
    /* Office-style stack: DM Sans is the closest neutral business sans we ship.
       Aptos/Calibri are listed so a rendering host with those installed will
       look indistinguishable from the reference PDF. */
    font-family: 'DM Sans', 'Aptos', 'Calibri', 'Segoe UI', Arial, sans-serif;
    font-size: 11px;
    line-height: 1.45;
    color: #000;
    background: #ffffff;
    /* DM Sans is a variable font with an opsz axis (9-40) that defaults to 9pt.
       At 11px Chrome auto-clamps to the 9pt caption master, which renders
       cramped. Pin opsz to 14 so we get the text master at all sizes. */
    font-optical-sizing: none;
    font-variation-settings: "opsz" 14, "wght" 400;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 4px 4px 0;
  }

  /* === HEADER ============================================================ */
  .header {
    text-align: center;
    margin-bottom: 10px;
  }

  .header h1 {
    font-size: 20px;
    font-weight: 700;
    font-variation-settings: "opsz" 14, "wght" 700;
    color: #000;
    margin-bottom: 4px;
  }

  .contact-row {
    font-size: 11px;
    color: #000;
    line-height: 1.4;
  }

  .contact-line {
    display: block;
    text-align: center;
  }

  .contact-row a.contact-line {
    color: #0563C1; /* Office hyperlink blue */
    text-decoration: underline;
  }

  /* === SECTION BANNER ==================================================== */
  .section {
    margin-bottom: 10px;
  }

  .section-title {
    background: #D9E2F1;
    padding: 4px 8px;
    font-size: 11.5px;
    font-weight: 700;
    font-variation-settings: "opsz" 14, "wght" 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    color: #000;
    margin-bottom: 7px;
  }

  /* === SUMMARY (optional, rendered above EDUCATION when present) ========= */
  .summary-text {
    font-size: 11px;
    color: #000;
    padding: 0 2px;
  }

  /* === EXPERIENCE & PROJECTS ============================================= */
  .job, .project, .edu-item {
    margin-bottom: 10px;
    page-break-inside: avoid;
    break-inside: avoid;
    padding: 0 2px;
  }

  .job-header, .edu-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
  }

  .job-role, .edu-degree, .project-title {
    font-weight: 700;
    font-variation-settings: "opsz" 14, "wght" 700;
    font-size: 11.5px;
    color: #000;
  }

  .job-period, .edu-year {
    font-weight: 400;
    font-size: 11px;
    color: #000;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .job-sub, .edu-sub {
    font-size: 11px;
    color: #000;
    margin-top: 0;
    margin-bottom: 2px;
  }

  .job ul, .project ul {
    list-style: disc;
    margin: 1px 0 0 22px;
  }

  .job li, .project li {
    font-size: 11px;
    line-height: 1.45;
    color: #000;
    margin-bottom: 1px;
  }

  /* === PROJECTS extras =================================================== */
  .project-badge {
    font-size: 10px;
    color: #444;
    font-weight: 400;
    margin-left: 6px;
  }

  .project-desc {
    font-size: 11px;
    color: #000;
    margin-top: 1px;
  }

  .project-tech {
    font-size: 10.5px;
    color: #444;
    margin-top: 2px;
  }

  /* === EDUCATION ========================================================= */
  .edu-desc {
    font-size: 11px;
    color: #000;
    margin-top: 1px;
  }

  /* === SKILLS — plain "Category: a | b | c" lines, no chips ============== */
  .skills-grid {
    display: block;
    padding: 0 2px;
  }

  .skill-item {
    font-size: 11px;
    line-height: 1.5;
    margin-bottom: 2px;
    color: #000;
  }

  .skill-category {
    font-weight: 400;
  }

  /* Education details bullet (matches reference layout). */
  .edu-details {
    list-style: disc;
    margin: 1px 0 0 22px;
  }

  .edu-details li {
    font-size: 11px;
    line-height: 1.45;
    color: #000;
  }

  /* === CORE COMPETENCIES — inline plain text, no pills =================== */
  .competencies-text {
    font-size: 11px;
    line-height: 1.5;
    color: #000;
    padding: 0 2px;
  }

  /* === CERTIFICATIONS ==================================================== */
  .cert-item {
    font-size: 11px;
    color: #000;
    margin-bottom: 2px;
    padding: 0 2px;
  }

  .cert-title {
    font-weight: 400;
  }

  @media print {
    .page { padding-top: 0; }
  }
</style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <div class="header">
    <h1>{{NAME}}</h1>
    <div class="contact-row">{{CONTACT_ROW}}</div>
  </div>

  <!-- Optional summary, rendered when present -->
  {{SUMMARY_BLOCK}}

  <!-- Section order matches the reference layout: Education → Experience → Skills.
       Projects, competencies, certifications still render if the data has them. -->
  {{EDUCATION_BLOCK}}

  {{EXPERIENCE_BLOCK}}

  {{PROJECTS_BLOCK}}

  {{SKILLS_BLOCK}}

  {{COMPETENCIES_BLOCK}}

  {{CERTIFICATIONS_BLOCK}}

</div>
</body>
</html>
