<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{NAME}} — Resume</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  body {
    font-family: Arial, Helvetica, 'Liberation Sans', 'Noto Sans', sans-serif;
    font-size: 10.5px;
    line-height: 1.42;
    color: #000;
    background: #fff;
  }

  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 2px 2px 0;
  }

  /* === HEADER (left-aligned) ============================================= */
  .header { margin-bottom: 9px; }

  .header h1 {
    font-size: 23px;
    font-weight: 700;
    letter-spacing: 0.2px;
    margin-bottom: 3px;
  }

  .contact-line {
    display: block;
    font-size: 10.5px;
    color: #333;
    line-height: 1.45;
  }
  .contact-line a { color: #333; text-decoration: none; }
  .work-rights {
    display: block;
    font-size: 10.5px;
    font-weight: 700;
    color: #000;
    margin-top: 2px;
  }

  /* === SECTION TITLE: bold uppercase + bottom rule (no banner) =========== */
  .section { margin-bottom: 9px; }

  .section-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #000;
    border-bottom: 1px solid #000;
    padding-bottom: 2px;
    margin: 11px 0 6px;
  }

  /* === SUMMARY ========================================================== */
  .summary-text { font-size: 10.5px; }

  /* === SKILLS: "Category: a, b, c" plain lines ========================== */
  .skill-item { font-size: 10.5px; line-height: 1.5; margin-bottom: 1px; }
  .skill-category { font-weight: 700; }

  /* === ENTRY ROWS (experience / projects / education) =================== */
  .entry { margin-bottom: 8px; page-break-inside: avoid; break-inside: avoid; }

  .entry-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .entry-left { font-size: 10.5px; }
  .entry-title { font-weight: 700; }
  .entry-org { font-weight: 400; }
  .entry-right {
    font-size: 10px;
    color: #555;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .entry-sub { font-size: 10.5px; font-style: italic; color: #000; margin: 1px 0; }
  .entry-desc { font-size: 10.5px; margin-top: 1px; }

  .entry ul { list-style: disc; margin: 2px 0 0 17px; }
  .entry li { font-size: 10.5px; line-height: 1.42; margin-bottom: 1.5px; }

  /* === CERTIFICATIONS =================================================== */
  .cert-item { font-size: 10.5px; margin-bottom: 1px; }

  /* === COMPETENCIES (inline, only if present) ========================== */
  .competencies-text { font-size: 10.5px; line-height: 1.5; }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <h1>{{NAME}}</h1>
    {{CONTACT_ROW}}
  </div>

  <!-- Order: Summary → Skills → Experience → Projects → Education -->
  {{SUMMARY_BLOCK}}

  {{SKILLS_BLOCK}}

  {{COMPETENCIES_BLOCK}}

  {{EXPERIENCE_BLOCK}}

  {{PROJECTS_BLOCK}}

  {{EDUCATION_BLOCK}}

  {{CERTIFICATIONS_BLOCK}}

</div>
</body>
</html>
